<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Lexicon - Book Reader & Etymology Insights</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            400: '#38bdf8',
                            500: '#06b6d4',
                            600: '#0891b2',
                            700: '#0e7490',
                            900: '#164e63'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'Merriweather', 'Lora', 'Georgia', 'serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PDF.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 4px; }

        #reactiveBg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            transition: background 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.6;
            transition: all 1.8s cubic-bezier(0.16, 1, 0.3, 1);
            animation: pulseAura 12s infinite alternate ease-in-out;
        }

        @keyframes pulseAura {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.12) translate(30px, -20px); }
            100% { transform: scale(0.9) translate(-25px, 25px); }
        }

        .book-stage {
            perspective: 2500px;
            transform-style: preserve-3d;
        }

        .book-spread-container {
            transform-style: preserve-3d;
            transition: box-shadow 0.8s ease;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.85);
            position: relative;
        }

        .flipping-leaf {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 35;
            pointer-events: none;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            border-radius: 4px;
            overflow: hidden;
            will-change: transform, box-shadow;
        }

        .flipping-leaf::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.16) 48%, rgba(255,255,255,0) 60%, rgba(0,0,0,0.18) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .flipping-leaf.flip-left-to-right::after,
        .flipping-leaf.flip-right-to-left::after {
            opacity: 1;
        }

        .flipping-leaf.flip-left-to-right {
            left: 0;
            transform-origin: right center;
            animation: flipPageLeftToRight 0.95s cubic-bezier(0.45, 0, 0.2, 1) forwards;
        }

        .flipping-leaf.flip-right-to-left {
            right: 0;
            transform-origin: left center;
            animation: flipPageRightToLeft 0.95s cubic-bezier(0.45, 0, 0.2, 1) forwards;
        }

        @keyframes flipPageRightToLeft {
            0% { transform: rotateY(0deg) skewY(0deg) scale(1); box-shadow: -10px 0 18px rgba(0,0,0,0.15); }
            50% { transform: rotateY(-90deg) skewY(-1deg) scale(0.965); box-shadow: -46px 12px 46px rgba(0,0,0,0.55); }
            100% { transform: rotateY(-180deg) skewY(0deg) scale(1); box-shadow: 0 0 4px rgba(0,0,0,0.08); }
        }

        @keyframes flipPageLeftToRight {
            0% { transform: rotateY(0deg) skewY(0deg) scale(1); box-shadow: 10px 0 18px rgba(0,0,0,0.15); }
            50% { transform: rotateY(90deg) skewY(1deg) scale(0.965); box-shadow: 46px 12px 46px rgba(0,0,0,0.55); }
            100% { transform: rotateY(180deg) skewY(0deg) scale(1); box-shadow: 0 0 4px rgba(0,0,0,0.08); }
        }

        .page-corner-curl {
            position: absolute;
            bottom: 0;
            width: 48px;
            height: 48px;
            z-index: 25;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0.6;
        }

        .page-corner-curl:hover { opacity: 1; width: 64px; height: 64px; }
        .page-corner-right { right: 0; background: linear-gradient(135deg, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(0, 0, 0, 0.25) 100%); border-bottom-right-radius: 12px; }
        .page-corner-left { left: 0; background: linear-gradient(-135deg, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(0, 0, 0, 0.25) 100%); border-bottom-left-radius: 12px; }

        .book-spine-crease {
            background: linear-gradient(
                90deg, 
                rgba(0,0,0,0.06) 0%, 
                rgba(0,0,0,0.25) 42%, 
                rgba(0,0,0,0.5) 50%, 
                rgba(0,0,0,0.25) 58%, 
                rgba(0,0,0,0.06) 100%
            );
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #wordTooltip { transition: opacity 0.2s ease, transform 0.2s ease; }
        #wordTooltip.hidden-bubble { opacity: 0; transform: scale(0.9) translateY(8px); pointer-events: none; }
        #wordTooltip.visible-bubble { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }

        .pdf-page-container { position: relative; overflow: hidden; }
        
        .textLayer {
            position: absolute;
            text-align: initial;
            inset: 0;
            opacity: 0.25;
            line-height: 1.0;
        }

        .textLayer span {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
        }

        .theme-dark-classic { background-color: #1e293b; color: #e2e8f0; }
        .theme-sepia { background-color: #fbf0d9; color: #432818; }
        .theme-midnight { background-color: #0b1329; color: #d1d5db; }
        .theme-academic { background-color: #ffffff; color: #1a1a1a; }
        .theme-romance { background-color: #fff0f4; color: #5b1233; }
        .theme-fantasy { background-color: #170a29; color: #ead9ff; }
        .theme-scifi { background-color: #010e14; color: #b6fff1; }

        ::selection { background: rgba(6, 182, 212, 0.35); color: inherit; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col overflow-x-hidden selection:bg-cyan-500/30 selection:text-cyan-200">

    <div id="reactiveBg" class="bg-slate-950">
        <div id="glowAura1" class="ambient-glow w-[500px] h-[500px] -top-20 -left-20 bg-cyan-900/40"></div>
        <div id="glowAura2" class="ambient-glow w-[600px] h-[600px] bottom-0 right-0 bg-indigo-900/40"></div>
    </div>

    <div class="relative z-10 flex flex-col min-h-screen">
        <header class="glass-header sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-xl">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-book-open text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-serif font-bold text-lg tracking-wide bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">DEEP LEXICON</h1>
                    <p class="text-[10px] text-slate-400 font-mono tracking-wider uppercase">Interactive Book Reader</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 md:space-x-4">
                <div class="flex items-center bg-slate-900/80 border border-slate-700/60 rounded-lg p-1 space-x-1 text-sm">
                    <button id="btnPrevPage" class="p-1.5 px-2.5 rounded-md hover:bg-slate-800 text-slate-300 hover:text-white transition"><i class="fa-solid fa-chevron-left"></i></button>
                    <span class="px-2 text-xs font-mono text-slate-400 flex items-center">
                        <input id="inputPageNum" type="number" min="1" value="1" class="w-10 bg-slate-950 border border-slate-800 rounded text-center text-cyan-400 font-bold focus:outline-none focus:border-cyan-500 py-0.5">
                        <span class="mx-1">/</span>
                        <span id="txtTotalPages">2</span>
                    </span>
                    <button id="btnNextPage" class="p-1.5 px-2.5 rounded-md hover:bg-slate-800 text-slate-300 hover:text-white transition"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <button id="btnToggleSpread" class="hidden sm:flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-slate-900/80 border border-slate-700/60 text-xs font-medium hover:bg-slate-800 text-slate-300 hover:text-cyan-400 transition">
                    <i class="fa-solid fa-book-open text-cyan-400"></i>
                    <span id="lblSpreadMode">2-Page Spread</span>
                </button>

                <div class="relative">
                    <button id="btnThemeMenu" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-slate-900/80 border border-slate-700/60 text-xs font-medium hover:bg-slate-800 text-slate-300 hover:text-cyan-400 transition">
                        <i class="fa-solid fa-palette text-cyan-400"></i>
                        <span class="hidden md:inline">Theme</span>
                    </button>
                    <div id="dropdownTheme" class="hidden absolute right-0 mt-2 w-48 glass-card rounded-xl shadow-2xl py-2 z-50 text-xs border border-slate-700/80">
                        <button id="btnAutoTheme" class="w-full px-4 py-2 text-left hover:bg-cyan-500/20 flex items-center space-x-2 text-cyan-300 border-b border-slate-700/60 mb-1 pb-2.5">
                            <span class="w-3 h-3 rounded-full bg-gradient-to-tr from-cyan-400 to-indigo-500"></span>
                            <span>✨ Auto-Detect Genre</span>
                        </button>
                        <button data-theme="scifi" class="theme-opt w-full px-4 py-2 text-left hover:bg-teal-500/20 flex items-center space-x-2 text-teal-200">
                            <span class="w-3 h-3 rounded-full bg-[#010e14] border border-teal-400"></span>
                            <span>Sci-Fi Nebula</span>
                        </button>
                        <button data-theme="dark-classic" class="theme-opt w-full px-4 py-2 text-left hover:bg-cyan-500/20 flex items-center space-x-2 text-slate-200">
                            <span class="w-3 h-3 rounded-full bg-slate-800 border border-slate-500"></span>
                            <span>Classic Dark</span>
                        </button>
                        <button data-theme="sepia" class="theme-opt w-full px-4 py-2 text-left hover:bg-amber-500/20 flex items-center space-x-2 text-amber-200">
                            <span class="w-3 h-3 rounded-full bg-[#fbf0d9] border border-amber-600"></span>
                            <span>Sepia Parchment</span>
                        </button>
                    </div>
                </div>

                <label class="cursor-pointer bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-medium text-xs px-3.5 py-2 rounded-lg shadow-md shadow-cyan-900/30 flex items-center space-x-2 transition">
                    <i class="fa-solid fa-file-arrow-up"></i>
                    <span class="hidden sm:inline">Open File</span>
                    <input type="file" id="fileInput" accept=".pdf,.txt" class="hidden">
                </label>
            </div>
        </header>

        <main class="flex-1 flex flex-col items-center justify-center p-2 sm:p-6 lg:p-8 relative">
            <div class="book-stage w-full max-w-6xl mx-auto flex flex-col items-center justify-center">
                <div id="bookInfoTag" class="mb-4 text-center">
                    <h2 id="docTitle" class="font-serif italic text-sm md:text-base text-slate-300 tracking-wide">"The Odyssey of Human Thought" — Demo Sample</h2>
                    <p id="detectedMoodTag" class="hidden text-[10px] font-mono text-slate-400 mt-1.5 inline-flex items-center px-2.5 py-1 rounded-full bg-slate-900/70 border border-slate-700/60"></p>
                </div>

                <!-- BOOK SPREAD WRAPPER -->
                <div id="bookSpread" class="book-spread-container relative w-full max-w-5xl rounded-2xl overflow-hidden theme-dark-classic flex transition-all duration-500 min-h-[500px] md:min-h-[640px]">
                    
                    <div id="flippingLeaf" class="flipping-leaf hidden">
                        <div id="flippingLeafContent" class="w-full h-full p-6 sm:p-10 md:p-12 font-serif text-sm md:text-base leading-relaxed bg-inherit text-inherit"></div>
                    </div>

                    <div id="bookSpine" class="book-spine-crease absolute inset-y-0 left-1/2 -translate-x-1/2 w-12 z-20 pointer-events-none hidden md:block"></div>

                    <!-- LEFT PAGE CONTAINER (Strict 50% width) -->
                    <div id="pageLeft" class="pdf-page-container w-full md:w-1/2 flex-1 p-6 sm:p-10 md:p-12 relative flex flex-col justify-between border-r border-slate-700/30 min-w-0">
                        <div id="curlLeft" class="page-corner-curl page-corner-left hidden" title="Flip to previous page"></div>
                        <div class="page-content font-serif text-slate-200 text-sm md:text-base leading-relaxed tracking-wide space-y-4 select-text flex-1 flex flex-col justify-center items-center">
                        </div>
                        <div class="page-footer font-mono text-[11px] text-slate-500 flex justify-between items-center pt-4 border-t border-slate-700/20 w-full">
                            <span id="pageLeftNum">Page 1</span>
                            <span class="italic font-serif text-[10px] opacity-60">Deep Lexicon Reader</span>
                        </div>
                    </div>

                    <!-- RIGHT PAGE CONTAINER (Strict 50% width) -->
                    <div id="pageRight" class="pdf-page-container w-full md:w-1/2 flex-1 p-6 sm:p-10 md:p-12 relative flex flex-col justify-between hidden md:flex min-w-0">
                        <div id="curlRight" class="page-corner-curl page-corner-right" title="Flip to next page"></div>
                        <div class="page-content font-serif text-slate-200 text-sm md:text-base leading-relaxed tracking-wide space-y-4 select-text flex-1 flex flex-col justify-center items-center">
                        </div>
                        <div class="page-footer font-mono text-[11px] text-slate-500 flex justify-between items-center pt-4 border-t border-slate-700/20 w-full">
                            <span class="italic font-serif text-[10px] opacity-60">Deep Lexicon Reader</span>
                            <span id="pageRightNum">Page 2</span>
                        </div>
                    </div>

                </div>

                <div class="w-full max-w-2xl mt-6 px-4 py-2 glass-card rounded-2xl flex items-center space-x-4 shadow-xl">
                    <span class="text-xs font-mono text-slate-400">Progression</span>
                    <input id="pageRangeSlider" type="range" min="1" max="2" value="1" class="flex-1 accent-cyan-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer">
                    <span id="progressPercent" class="text-xs font-mono text-cyan-400 font-bold">50%</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        const AppState = {
            currentPage: 1,
            totalPages: 2,
            isSpreadMode: true,
            theme: 'dark-classic',
            docType: 'sample',
            pdfDoc: null,
            rawFullText: '',
            paginatedPages: []
        };

        const DEMO_PAGES = [
            `In modern digital architecture, ubiquitous algorithms silently direct human behavior across every sphere of life. The intellectual pursuit of understanding language and its foundational origins has captivated scholars throughout human history.`,
            `The ephemeral nature of spoken dialogue contrasts sharply with the enduring durability of written manuscripts. When an individual encounters an unfamiliar word within an intricate text, context provides the first vital clue to its intrinsic meaning.`
        ];

        const GENRE_PROFILES = {
            scifi: {
                theme: 'scifi', label: 'Sci-Fi / Quantum Thriller', icon: '🚀',
                keywords: ['quantum', 'multiverse', 'dimension', 'box', 'jason', 'dark matter', 'reality', 'physics', 'schrodinger', 'superposition', 'laboratory', 'spaceship', 'alien', 'galaxy', 'cyborg', 'android', 'interstellar', 'timeline']
            },
            thriller: {
                theme: 'dark-classic', label: 'Thriller / Suspense', icon: '🕵️',
                keywords: ['murder', 'blood', 'detective', 'gun', 'kidnapped', 'chase', 'knife', 'victim', 'investigation', 'police', 'conspiracy', 'stalker']
            },
            romance: {
                theme: 'romance', label: 'Romance', icon: '🌸',
                keywords: ['love', 'kiss', 'heart', 'passion', 'desire', 'wedding', 'lovers', 'beloved', 'affection']
            },
            fantasy: {
                theme: 'fantasy', label: 'Fantasy', icon: '🐉',
                keywords: ['dragon', 'magic', 'wizard', 'sorcerer', 'kingdom', 'spell', 'sword', 'realm', 'enchanted']
            }
        };

        let elPageLeft, elPageRight, elPageLeftNum, elPageRightNum, elInputPageNum, elTxtTotalPages, elPageRangeSlider, elProgressPercent, elBookSpread, elReactiveBg;

        function initDOMCache() {
            elPageLeft = document.getElementById('pageLeft');
            elPageRight = document.getElementById('pageRight');
            elPageLeftNum = document.getElementById('pageLeftNum');
            elPageRightNum = document.getElementById('pageRightNum');
            elInputPageNum = document.getElementById('inputPageNum');
            elTxtTotalPages = document.getElementById('txtTotalPages');
            elPageRangeSlider = document.getElementById('pageRangeSlider');
            elProgressPercent = document.getElementById('progressPercent');
            elBookSpread = document.getElementById('bookSpread');
            elReactiveBg = document.getElementById('reactiveBg');
        }

        async function renderCurrentSpread() {
            const pageIndex = AppState.currentPage;
            const isMobile = window.innerWidth < 768;
            const useSpread = AppState.isSpreadMode && !isMobile;

            if (AppState.docType === 'pdf') {
                AppState.totalPages = AppState.pdfDoc.numPages;
                
                // Render Page 1 to Left Container
                await renderPdfPageToContainer(pageIndex, elPageLeft);
                elPageLeftNum.textContent = `Page ${pageIndex}`;

                // Render Page 2 to Right Container
                if (useSpread && pageIndex < AppState.totalPages) {
                    elPageRight.classList.remove('hidden');
                    document.getElementById('bookSpine').classList.remove('hidden');
                    await renderPdfPageToContainer(pageIndex + 1, elPageRight);
                    elPageRightNum.textContent = `Page ${pageIndex + 1}`;
                } else {
                    elPageRight.classList.add('hidden');
                    document.getElementById('bookSpine').classList.add('hidden');
                }
            } else {
                // Text rendering
                elPageLeft.querySelector('.page-content').innerHTML = `<p>${AppState.paginatedPages[pageIndex - 1] || ''}</p>`;
                elPageLeftNum.textContent = `Page ${pageIndex}`;

                if (useSpread && pageIndex < AppState.paginatedPages.length) {
                    elPageRight.classList.remove('hidden');
                    elPageRight.querySelector('.page-content').innerHTML = `<p>${AppState.paginatedPages[pageIndex] || ''}</p>`;
                    elPageRightNum.textContent = `Page ${pageIndex + 1}`;
                } else {
                    elPageRight.classList.add('hidden');
                }
            }

            elInputPageNum.value = pageIndex;
            elTxtTotalPages.textContent = AppState.totalPages;
            elPageRangeSlider.max = AppState.totalPages;
            elPageRangeSlider.value = pageIndex;
            elProgressPercent.textContent = `${Math.round((pageIndex / AppState.totalPages) * 100)}%`;
        }

        async function renderPdfPageToContainer(pageNum, container) {
            const contentDiv = container.querySelector('.page-content');
            contentDiv.innerHTML = '';

            try {
                const page = await AppState.pdfDoc.getPage(pageNum);
                
                // Calculate responsive scale to fit strictly inside container
                const containerWidth = container.clientWidth - 48; // accounting for padding
                const unscaledViewport = page.getViewport({ scale: 1.0 });
                const scale = containerWidth / unscaledViewport.width;
                const viewport = page.getViewport({ scale: scale || 1.0 });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                canvas.className = 'max-w-full h-auto rounded shadow-lg border border-slate-700/40';

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                contentDiv.appendChild(canvas);

                const textContent = await page.getTextContent();
                const textLayerDiv = document.createElement('div');
                textLayerDiv.className = 'textLayer';
                
                pdfjsLib.renderTextLayer({
                    textContentSource: textContent,
                    container: textLayerDiv,
                    viewport: viewport,
                    textDivs: []
                });

                contentDiv.appendChild(textLayerDiv);
            } catch (err) {
                console.error("PDF Render Error:", err);
            }
        }

        async function detectAndApplyBookTheme() {
            const badge = document.getElementById('detectedMoodTag');
            if (badge) {
                badge.classList.remove('hidden');
                badge.textContent = '🔎 Scanning book keywords...';
            }

            let text = '';
            if (AppState.docType === 'pdf' && AppState.pdfDoc) {
                const maxPages = Math.min(AppState.pdfDoc.numPages, 20);
                for (let i = 1; i <= maxPages; i++) {
                    const page = await AppState.pdfDoc.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(it => it.str).join(' ') + ' ';
                }
            } else {
                text = AppState.rawFullText || DEMO_PAGES.join(' ');
            }

            const lower = text.toLowerCase();
            let matchedGenre = null;
            let maxScore = 0;

            Object.entries(GENRE_PROFILES).forEach(([key, profile]) => {
                let score = 0;
                profile.keywords.forEach(kw => {
                    const matches = lower.match(new RegExp(`\\b${kw}\\b`, 'gi'));
                    if (matches) score += matches.length;
                });
                if (score > maxScore) {
                    maxScore = score;
                    matchedGenre = profile;
                }
            });

            if (matchedGenre && maxScore >= 3) {
                applyTheme(matchedGenre.theme);
                if (badge) badge.textContent = `${matchedGenre.icon} Auto-detected: ${matchedGenre.label}`;
            } else {
                applyTheme('dark-classic');
                if (badge) badge.textContent = `🎨 Defaulting to Classic Dark Theme`;
            }
        }

        function applyTheme(themeName) {
            AppState.theme = themeName;
            elBookSpread.className = `book-spread-container relative w-full max-w-5xl rounded-2xl overflow-hidden transition-all duration-500 min-h-[500px] md:min-h-[640px] theme-${themeName}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDOMCache();
            AppState.paginatedPages = DEMO_PAGES;
            AppState.totalPages = DEMO_PAGES.length;
            renderCurrentSpread();

            document.getElementById('fileInput').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                document.getElementById('docTitle').textContent = `"${file.name}"`;

                if (file.type === 'application/pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    AppState.pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    AppState.docType = 'pdf';
                    AppState.currentPage = 1;
                    renderCurrentSpread();
                    detectAndApplyBookTheme();
                }
            });

            document.getElementById('btnNextPage').addEventListener('click', () => {
                if (AppState.currentPage < AppState.totalPages) {
                    AppState.currentPage += 2;
                    renderCurrentSpread();
                }
            });

            document.getElementById('btnPrevPage').addEventListener('click', () => {
                if (AppState.currentPage > 1) {
                    AppState.currentPage -= 2;
                    renderCurrentSpread();
                }
            });
        });
    </script>
</body>
</html>
